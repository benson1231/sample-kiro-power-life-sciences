[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "life-sciences-common"
version = "0.1.0"
description = "Shared base package for all Kiro Life Sciences MCP servers — base server class, retry logic, and standardized error handling."
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Kiro Life Sciences Contributors" },
]
keywords = [
    "kiro",
    "life-sciences",
    "mcp",
    "bioinformatics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "httpx>=0.27,<1",
    "mcp>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "respx>=0.22,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/life_sciences_common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
