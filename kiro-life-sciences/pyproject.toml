[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kiro-life-sciences"
version = "0.1.0"
description = "A unified Kiro Power for life sciences — onboarding dashboard, resource catalog, credential manager, skills, and steering files."
readme = "POWER.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Kiro Life Sciences Contributors" },
]
keywords = [
    "kiro",
    "life-sciences",
    "bioinformatics",
    "genomics",
    "proteomics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "pydantic>=2.0,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "hypothesis>=6.100,<7",
    "pytest-asyncio>=0.23,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kiro_life_sciences"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
